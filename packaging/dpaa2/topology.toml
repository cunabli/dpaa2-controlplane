# DPAA2 desired topology for the LX2160A board.
#
# Each [port.<name>] carries the interface name in its table key (ADR-0015 decision 1)
# and its stable DPMAC anchor as `dpmac`. The DPNI index is NEVER named here — a managed
# DPNI's identity is derived from its connection edge to the DPMAC
# (design D1). Board mapping (verified 2026-07-04, MC 10.32.0):
#   dpmac.3-6   = QSFP28 breakout, 25G (CAUI)
#   dpmac.7-10  = SFP+ cage, 10G (XFI)
#   dpmac.17    = onboard 1G management (already dpni.0 — do NOT list here)
#
# `mac` is optional. When present it is asserted by default (verified against the
# netdev's inherited DPMAC MAC, never written). Set `mac_mode = "actuate"` only to
# have the reconciler set the DPNI primary MAC.
#
# A [port.<name>] with no `tenant` belongs to the reserved `kernel` dataplane (design D1).
# This example is kernel-port-only, the subset `dpaa2ctl` executes today; construct
# intents (tenants, links, fabrics, crypto) are documented in ADR-0013.

[intent]
schema = 1

[port.lan0]
dpmac = "dpmac.7"
rate = 10000

[port.lan1]
dpmac = "dpmac.8"
rate = 10000

# Example 25G port on the QSFP28 breakout:
# [port.wan0]
# dpmac = "dpmac.3"
# rate = 25000
