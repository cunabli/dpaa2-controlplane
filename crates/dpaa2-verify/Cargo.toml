[package]
name = "dpaa2-verify"
version.workspace = true
license.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "dpaa2_verify"
path = "src/lib.rs"

[[bin]]
name = "dpaa2-verify"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dpaa2-api.workspace = true
dpaa2-hal.workspace = true
dpaa2-mc.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The overcommit-rollback simulation drives the shared `testkit` FakeBackend as both southbound
# seam through the Recording layer (plan-rollback task 5.2).
dpaa2-api = { workspace = true, features = ["testkit"] }
dpaa2-config.workspace = true
proptest.workspace = true

[lints]
workspace = true
