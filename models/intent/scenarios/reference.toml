# The fit check of the intent gate (intent-layer design D8/D12; task 2.5): the
# operator's file for scenarios/reference.qnt — the reference LX2160A board's
# deployed provisioning. One userspace-poll tenant terminates the two cabled
# 10G ports (dpmac.7 and dpmac.9); the reserved kernel tenant is implicit
# (design D1), never written. No fabric, no link, no accelerator. No dpio,
# dpbp, dpcon, dpmcp, queue or worker count appears: every object and count is
# derived (ADR-0005) — the compiler draws T = 5, 2 dpnis, dpio = 10, dpbp = 2,
# dpcon = 10 and one dpmcp for the child. This scenario has no negative twin:
# its counterpart is the recovered boot census in
# models/board/baselines/reference.json, which reference.qnt diffs the compiled
# plan against object-for-object. Pairing with reference.qnt is by convention
# until dpaa2-verify's test (task 3.4).

schema = 1

[[tenant]]
name = "router"
dataplane = "userspace-poll"
max_cores = 16           # the board's online-CPU count; T = 5 sits well under

# The two cabled 10G ports of the deployed board (the seeded rate class,
# 10G => 2 workers each).
[[port]]
name = "wan0"
dpmac = "dpmac.7"
rate = 10000             # Mbps, the unit `dpmac info` reports maxima in
tenant = "router"

[[port]]
name = "wan1"
dpmac = "dpmac.9"
rate = 10000
tenant = "router"
