# The MVP operand of suite V-MVP-1 (pool-objects task 4.3, bead
# dpaa2-controlplane-960.12; system-integration req 1): ONE intent file that
# converges the MVP end to end — a reserved-kernel interface AND an isolated
# userspace tenant, so a single `dpaa2ctl ensure` grows the root pool, attaches
# the kernel dpni, and populates the userspace child container in one pass.
#
# Lives in the suite dir, not models/intent/scenarios/, for the reason
# V-POOL-6/V-DPRC-9's operands do: a board-suite operand is an input to a
# dpaa2ctl sitting, not a models/intent/scenarios pairing (no `.qnt`, no frozen
# trace); its derivation is pinned offline by
# crates/dpaa2-tools/tests/vmvp_intents.rs.
#
# Mixed dpmac choice (ADR-0003 §4): a live carrier witness is only observable on
# a kernel-bound netdev, so the kernel port takes the wired 10G dpmac.7 under a
# flagged link-signaling run (the operator's decision for this suite). The
# userspace child runs no dataplane here, so its carrier is unobservable
# regardless — its port takes the unwired lifecycle-safe 25G dpmac.5, keeping
# production-wire exposure to the single kernel port.

[intent]
schema = 1

# The reserved kernel terminates the wired 10G port, so its dpni + pool
# companions compile into the ROOT container (Tenant::container => Root,
# pool-objects design D5). The `kernel` tenant is never a `[tenant.kernel]`
# table (ADR-0013: declaring it is refused) — the tools shell injects it
# (crates/dpaa2-tools/src/main.rs `complete_kernel`). dpmac.7 is the flagged
# wired pair (ADR-0003 §4), permitted here under the suite's link-signaling
# class; the kernel netdev witnesses real carrier on it.
[port.kern0]
dpmac = "dpmac.7"
rate = 10000
tenant = "kernel"

# The isolated userspace tenant: a poll-mode dataplane the child DPRC hands off
# to VFIO. max_cores is the board's online-CPU count (T sits well under it).
[tenant.router]
dataplane = "userspace-poll"
max_cores = 16

# One router port terminates the unwired 25G dpmac.5 (lifecycle-safe: link-up is
# never asserted, ADR-0003 §4). Its dpni + companions land in the router's own
# child container — the spec's "a dpni and its derived companions".
[port.rtr0]
dpmac = "dpmac.5"
rate = 25000
tenant = "router"
